[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "policy-local-embeddings"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.0,<3",
  "onnxruntime>=1.22,<2",
  "transformers>=4.55,<5",
  "uvicorn[standard]>=0.35,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/policy_embeddings"]
