[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "policy-api"
version = "0.1.0"
description = "Evidence-grounded enterprise policy assistant API"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=6.1,<7",
  "pydantic-settings>=2.10,<3",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/policy_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
norecursedirs = ["backup_*"]
